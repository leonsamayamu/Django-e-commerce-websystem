{% extends "store/base.html" %}
{% block title %}Unsubscribe{% endblock %}
{% block content %}
<div class="mx-auto my-8 max-w-md"><div class="card p-6 sm:p-8"><h1 class="mb-3">Unsubscribe</h1><p class="text-slate-700">Stop sending newsletters to <strong>{{ sub.email }}</strong>?</p>
<form method="post" class="mt-5 flex items-center gap-3">{% csrf_token %}<button class="btn btn-danger" type="submit">Yes, unsubscribe</button><a class="text-sm" href="{% url 'product_list' %}">Cancel</a></form></div></div>
{% endblock %}
