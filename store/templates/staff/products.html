{% extends "store/base.html" %}
{% block title %}Products{% endblock %}
{% block content %}
<h1>Products</h1>
<div class="row-actions"><a class="btn" href="{% url 'staff_product_new' %}">Add product</a></div>
<div class="table-wrap"><table>
  <tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Visible</th><th></th></tr>
  {% for p in products %}
  <tr><td>{{ p.name }}</td><td>{{ p.category }}</td><td>{{ p.price }}</td><td>{{ p.stock }}</td>
      <td>{{ p.available|yesno:"Yes,No" }}</td><td><a href="{% url 'staff_product_edit' p.pk %}">Edit</a></td></tr>
  {% endfor %}
</table></div>
{% endblock %}
