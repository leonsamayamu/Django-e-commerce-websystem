{% extends "panel/base.html" %}
{% block title %}Categories{% endblock %}
{% block content %}
<div class="mb-4 flex items-center justify-between"><h1>Categories</h1><a class="btn" data-modal href="{% url 'staff_category_new' %}">+ Add category</a></div>
<div class="overflow-x-auto"><table class="tbl max-w-3xl">
  <thead><tr><th>Name</th><th>Products</th><th></th></tr></thead>
  <tbody>
  {% for c in categories %}
  <tr><td class="font-medium">{{ c.name }}</td><td><a href="{% url 'staff_products' %}?category={{ c.pk }}">{{ c.n }}</a></td>
      <td class="whitespace-nowrap text-right"><a class="btn btn-outline btn-sm" data-modal href="{% url 'staff_category_edit' c.pk %}">Edit</a> <a class="btn btn-danger btn-sm" data-modal href="{% url 'staff_category_delete' c.pk %}">Delete</a></td></tr>
  {% empty %}<tr><td colspan="3" class="py-8 text-center text-slate-500">No categories yet.</td></tr>{% endfor %}
  </tbody>
</table></div>
{% endblock %}
