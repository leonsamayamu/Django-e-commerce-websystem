{% load panel_ui %}<form method="post" action="{{ request.path }}" enctype="multipart/form-data" data-modal-form>
  {% csrf_token %}
  <div class="flex items-start justify-between gap-4 border-b border-slate-200 px-6 py-4">
    <div><h2 id="modal-title" class="text-lg font-semibold">{{ title }}</h2>{% if subtitle %}<p class="text-sm text-slate-500">{{ subtitle }}</p>{% endif %}</div>
    <button type="button" data-modal-close class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-700" aria-label="Close">
      {% icon "x-mark" "h-5 w-5" %}
    </button>
  </div>
  <div class="max-h-[calc(100vh-14rem)] overflow-y-auto px-6 py-5">{% include "panel/_form_body.html" %}</div>
  <div class="flex justify-end gap-3 rounded-b-2xl border-t border-slate-200 bg-slate-50 px-6 py-4">
    <button type="button" data-modal-close class="btn btn-outline">Cancel</button>
    <button type="submit" class="btn {% if danger %}btn-danger{% endif %}">{{ submit }}</button>
  </div>
</form>
