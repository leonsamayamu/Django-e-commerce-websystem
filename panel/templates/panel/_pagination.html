{% if page.paginator.num_pages > 1 %}
<nav class="mt-4 flex items-center justify-between text-sm" aria-label="Pages">
  <span class="text-slate-500">Page {{ page.number }} of {{ page.paginator.num_pages }} &middot; {{ page.paginator.count }} total</span>
  <span class="flex gap-2">
    {% if page.has_previous %}<a class="chip" href="?{% if query_string %}{{ query_string }}&{% endif %}page={{ page.previous_page_number }}">&laquo; Prev</a>{% endif %}
    {% if page.has_next %}<a class="chip" href="?{% if query_string %}{{ query_string }}&{% endif %}page={{ page.next_page_number }}">Next &raquo;</a>{% endif %}
  </span>
</nav>
{% endif %}
