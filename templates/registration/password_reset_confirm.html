{% extends "store/base.html" %}
{% block content %}
<div class="mx-auto my-8 max-w-md"><div class="card p-6 sm:p-8">
{% if validlink %}
  <h1 class="mb-6">Choose a new password</h1>
  <form method="post">{% csrf_token %}{% include "partials/form.html" %}<button class="btn w-full" type="submit">Save password</button></form>
{% else %}
  <h1 class="mb-3">Link expired</h1><p class="text-slate-700">This reset link is invalid or has already been used.</p><a class="btn mt-5" href="{% url 'password_reset' %}">Request a new link</a>
{% endif %}
</div></div>
{% endblock %}
