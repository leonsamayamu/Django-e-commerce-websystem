{% extends "store/base.html" %}
{% block title %}Register - {{ shop_name }}{% endblock %}
{% block content %}
<div class="mx-auto my-8 max-w-md"><div class="card p-6 sm:p-8">
  <h1 class="mb-6">Create account</h1>
  <form method="post">{% csrf_token %}{% include "partials/form.html" %}<button class="btn w-full" type="submit">Register</button></form>
  <p class="mt-4 text-center text-sm text-slate-500">Already registered? <a href="{% url 'login' %}">Log in</a></p>
</div></div>
{% endblock %}
