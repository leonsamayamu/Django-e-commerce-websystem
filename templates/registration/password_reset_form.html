{% extends "store/base.html" %}
{% block title %}Reset password - {{ shop_name }}{% endblock %}
{% block content %}
<div class="mx-auto my-8 max-w-md"><div class="card p-6 sm:p-8">
  <h1 class="mb-2">Reset your password</h1>
  <p class="mb-6 text-sm text-slate-500">Enter your account email and we will send you a reset link.</p>
  <form method="post">{% csrf_token %}{% include "partials/form.html" %}<button class="btn w-full" type="submit">Send reset link</button></form>
</div></div>
{% endblock %}
