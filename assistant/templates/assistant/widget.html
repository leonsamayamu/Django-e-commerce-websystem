{% load static %}
<div id="assistant" data-init="{% url 'assistant_init' %}" data-chat="{% url 'assistant_chat' %}" data-reset="{% url 'assistant_reset' %}" data-csrf="{{ csrf_token }}">
  <button id="assistant-open" type="button" class="fixed bottom-4 right-4 z-40 flex h-14 items-center gap-2 rounded-full bg-teal-700 px-5 text-sm font-semibold text-white shadow-lg transition hover:bg-teal-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700" aria-expanded="false" aria-controls="assistant-panel">
    <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zM12 21a9 9 0 10-8.04-4.97L3 21l4.97-.96A8.96 8.96 0 0012 21z"/></svg>
    <span class="hidden sm:inline">Ask us</span>
  </button>
  <section id="assistant-panel" class="fixed inset-x-3 bottom-3 z-50 hidden max-h-[80vh] flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-2xl sm:inset-x-auto sm:bottom-4 sm:right-4 sm:w-96" role="dialog" aria-label="{{ assistant_name }}">
    <header class="flex items-center justify-between gap-2 bg-teal-700 px-4 py-3 text-white">
      <div><p class="font-semibold">{{ assistant_name }}</p><p class="text-xs text-teal-100">Answers from the shop's own information</p></div>
      <div class="flex items-center gap-1">
        <button id="assistant-reset" type="button" class="rounded-lg px-2 py-1 text-xs text-teal-50 hover:bg-teal-800" title="Start a new chat">New chat</button>
        <button id="assistant-close" type="button" class="rounded-lg p-1.5 hover:bg-teal-800" aria-label="Close chat"><svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </header>
    <div id="assistant-log" class="flex min-h-[12rem] flex-1 flex-col gap-2 overflow-y-auto bg-slate-50 p-4 text-sm" aria-live="polite"></div>
    <div id="assistant-chips" class="flex flex-wrap gap-2 border-t border-slate-100 bg-white px-4 py-2"></div>
    <form id="assistant-form" class="flex gap-2 border-t border-slate-200 bg-white p-3">
      <label for="assistant-input" class="sr-only">Your question</label>
      <input id="assistant-input" type="text" maxlength="500" autocomplete="off" placeholder="Type a question or /help" class="flex-1">
      <button class="btn" type="submit">Send</button>
    </form>
    <p class="bg-white px-4 pb-2 text-[11px] text-slate-400">The assistant cannot see your orders or account. Never share passwords or PINs.</p>
  </section>
</div>
<script src="{% static 'assistant/assistant.js' %}" defer></script>
